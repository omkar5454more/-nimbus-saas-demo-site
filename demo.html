<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Book a demo | Nimbus</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem("nimbus_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="/assets/css/nimbus.css">
  <script src="/optimize.config.js"></script>
  <script src="/optimize-snippet.js"></script>
</head>
<body data-page="demo">
  <main id="main">
    <section class="block" style="padding-top:56px"><div class="wrap narrow">
      <div class="center" style="margin-bottom:30px"><span class="eyebrow">Book a demo</span><h1 style="font-size:clamp(30px,4vw,46px)" id="demo-title">See Nimbus with your own plan</h1><p class="lead" style="margin-inline:auto">A 20-minute walkthrough tailored to your team. (Demo form: nothing is sent.)</p></div>
      <div class="card-form">
        <div class="notice"><b>Demo:</b> please don't enter real personal details.</div>
        <form id="demo-form" autocomplete="off">
          <div class="field"><label for="d-name">Your name</label><input id="d-name" name="name" type="text" required></div>
          <div class="field"><label for="d-email">Work email</label><input id="d-email" name="email" type="email" required></div>
          <div class="field"><label for="d-company">Company</label><input id="d-company" name="company" type="text"></div>
          <div class="field"><label for="d-size">Team size</label><select id="d-size" name="size"><option>1–20</option><option selected>21–100</option><option>101–500</option><option>500+</option></select></div>
          <div class="field"><label for="d-note">What would you like to see?</label><textarea id="d-note" name="note" rows="3"></textarea></div>
          <button class="btn lg block" type="submit" id="demo-submit">Request my demo</button>
        </form>
        <div id="demo-thanks" class="center" hidden><div style="font-size:52px">🎉</div><h2 style="font-size:28px;margin:8px 0">Thanks! We'll be in touch (demo)</h2><p class="muted">Nothing was sent. This is a test form.</p></div>
      </div>
    </div></section>
  </main>
  <script src="/assets/js/posts.js"></script>
  <script src="/assets/js/nimbus.js"></script>
</body>
</html>
