<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Docs | Nimbus</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <script>try{var t=localStorage.getItem("nimbus_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="/assets/css/nimbus.css">
  <script src="/optimize.config.js"></script>
  <script src="/optimize-snippet.js"></script>
</head>
<body data-page="docs">
  <main id="main">
    <!-- A tiny single-page app: links change the content with history.pushState (?page=...), without a full page load.
         Good for testing that Optimize counts route changes as page views and re-evaluates campaigns. -->
    <div class="wrap docs"><aside id="docs-nav" aria-label="Documentation"></aside><div id="docs-view"></div></div>
  </main>
  <script src="/assets/js/posts.js"></script>
  <script src="/assets/js/nimbus.js"></script>
</body>
</html>
